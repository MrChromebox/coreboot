name: Build Coreboot Firmware

on:
  workflow_dispatch:
    inputs:
      board:
        description: 'Target board name (e.g. panther, lumpy, etc.)'
        required: true
        default: 'panther'

jobs:
  build-coreboot:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bison build-essential curl flex git gnat imagemagick \
            libncurses5-dev m4 nasm python-is-python3 uuid-dev \
            zlib1g-dev libssl-dev

      - name: Clone coreboot
        run: |
          git clone https://github.com/mrchromebox/coreboot.git
          cd coreboot
          git submodule update --init --checkout --recursive

      - name: Build toolchain
        run: |
          cd coreboot
          make crossgcc-i386 CPUS=$(nproc)

      - name: Build firmware
        run: |
          cd coreboot
          ./build-uefi.sh ${{ github.event.inputs.board }}

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: coreboot-rom
          path: ~/dev/roms/*.rom
